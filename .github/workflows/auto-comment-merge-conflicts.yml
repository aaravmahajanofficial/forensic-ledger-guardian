name: Auto Comment Merge Conflicts

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-comment-merge-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PRs are dirty
        uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: "merge-conflict"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "Merge conflict detected with the base branch. Please rebase or merge the latest base into this branch, resolve conflicts, and push so the PR is mergeable again."
          commentOnClean: "Merge conflicts have been resolved."
