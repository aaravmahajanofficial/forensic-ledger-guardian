name: Auto Comment Merge Conflicts

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-comment-merge-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on merge conflicts
        uses: codytseng/auto-comment-merge-conflicts@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Exact text used both to post and to find/remove later — keep stable
          comment-body: |
            @Jules Merge conflict detected with the base branch.

            Please rebase or merge the latest base into this branch, resolve conflicts, and push so the PR is mergeable again.
          wait-ms: 3000
          max-retries: 5
          label-name: merge-conflict
          ignore-authors: dependabot[bot],renovate[bot]
